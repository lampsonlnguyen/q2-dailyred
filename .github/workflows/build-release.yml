name: Build and release Q2 Daily Red

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to publish (e.g. v1.0.1); leave blank for a build only'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dailyred-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Check shell scripts
        run: |
          sh -n src/build-q2.sh tests/run_tests.sh tools/ci-sysroot.sh
          sh -n package/.dailyred/run
          grep -Fqx 'exec /tmp/q2-dailyred.bin' package/.dailyred/run
          bash -n scripts/fetch-pokefirered.sh scripts/build-rom-linux.sh scripts/setup-linux.sh
      - name: Run host logic tests
        run: sh tests/run_tests.sh
      - name: Disallow committed ROM, BIOS and saves
        run: |
          if git ls-files | grep -Ei '\.(gba|gb|gbc|sav|srm)(\.gz)?$|(^|/)(gba_bios|bios)\.bin$'; then
            echo "::error::ROM, BIOS or save data must never be committed"
            exit 1
          fi

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Q2 cross-build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm git make zip unzip curl xz-utils binutils squashfs-tools python3 file
      - name: Construct Shanling Q2 cross sysroot
        run: sh tools/ci-sysroot.sh
      - name: Build MIPS app and gpSP
        run: |
          export SYSROOT="$HOME/.cache/q2/sysroot"
          sh src/build-q2.sh
          test -s dist/.dailyred/q2-dailyred
          file dist/.dailyred/q2-dailyred
      - name: Package ROM-free SD card app
        run: |
          test ! -f dist/.dailyred/dailyred.gba
          (cd dist && zip -qr q2-dailyred.zip .dailyred)
          unzip -t dist/q2-dailyred.zip
          if unzip -Z1 dist/q2-dailyred.zip | grep -Ei '\.(gba|gb|gbc|sav|srm)(\.gz)?$|(^|/)(gba_bios|bios)\.bin$'; then
            echo "::error::ROM or BIOS included in release archive"
            exit 1
          fi
          unzip -Z1 dist/q2-dailyred.zip | grep -Fx '.dailyred/q2-dailyred'
          unzip -Z1 dist/q2-dailyred.zip | grep -Fx '.dailyred/q2app'
          unzip -Z1 dist/q2-dailyred.zip | grep -Fx '.dailyred/run'
      - uses: actions/upload-artifact@v4
        with:
          name: q2-dailyred-card-app
          path: dist/q2-dailyred.zip
          if-no-files-found: error
      - name: Determine release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=""
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" == v* ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$EVENT" == "push" && "$REF_NAME" == "main" ]] && ! gh release view v1.0.1 >/dev/null 2>&1; then
            tag="v1.0.1"
          fi
          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        if: steps.version.outputs.tag != '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          Q2 Daily Red card application for Shanling Q2 Pod 1.9.0+.

          This ZIP contains the Q2 launcher and statically linked gpSP emulator, but **does not contain a Pokémon ROM**.
          Build the Daily Red ROM locally using `scripts/setup-linux.sh`,
          `scripts/fetch-pokefirered.sh`, and `scripts/build-rom-linux.sh`,
          then copy `.build/rom/dailyred.gba` to `.dailyred/dailyred.gba` on your SD card.

          Unofficial free fan project. Not affiliated with or endorsed by Nintendo,
          Creatures Inc., GAME FREAK inc. or The Pokémon Company.
          Pokémon and related names, characters and content are © Nintendo,
          Creatures Inc. and GAME FREAK inc.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/q2-dailyred.zip --clobber
          else
            gh release create "$TAG" dist/q2-dailyred.zip \
              --target "$GITHUB_SHA" --title "Q2 Daily Red ${TAG#v}" \
              --notes-file /tmp/release-notes.md
          fi
